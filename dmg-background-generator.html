<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            width: 540px;
            height: 380px;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e1e2e 0%, #181825 100%);
            color: #cdd6f4;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .title {
            font-size: 24px;
            font-weight: 600;
            color: #74c7ec;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 16px;
            color: #a6e3a1;
            margin-bottom: 30px;
        }
        
        .instruction {
            font-size: 14px;
            color: #cdd6f4;
            opacity: 0.8;
        }
        
        .arrow {
            font-size: 48px;
            color: #89b4fa;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="title">JMeter Performance Test Runner</div>
    <div class="subtitle">Modern GUI for Performance Testing</div>
    <div class="arrow">→</div>
    <div class="instruction">Drag to Applications folder to install</div>
</body>
</html>
